repos:
  # Route Python files through YAPF for two-space indentation
  - repo: https://github.com/google/yapf
    rev: v0.43.0
    hooks:
      - id: yapf
        args: ["--style=.style.yapf", "--in-place"]

  # Route Shell files through shfmt
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.10.0-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-sr", "-ci", "-w"]

  # Route C and H files through clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.8 # Use the version matching your target toolchain
    hooks:
      - id: clang-format
        # Explicitly targets C source and header files
        types_or: [c, c++]
